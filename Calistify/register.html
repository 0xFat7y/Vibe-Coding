<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CALISTIFY</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <!-- Mobile Navigation -->
  <div class="mobile-nav" id="mobileNav">
    <div class="mobile-nav-header">
      <div class="mobile-nav-logo">CALISTIFY</div>
      <button class="mobile-nav-close" onclick="closeMobileNav()"><i class="fas fa-times"></i></button>
    </div>
    <nav class="mobile-nav-links" id="mobileNavLinks">
      <a href="index.html" onclick="closeMobileNav()">
        <span class="nav-icon"><i class="fas fa-house"></i></span> Home
      </a>
      <a href="about.html" onclick="closeMobileNav()">
        <span class="nav-icon"><i class="fas fa-circle-info"></i></span> About
      </a>
      <a href="training.html" onclick="closeMobileNav()">
        <span class="nav-icon"><i class="fas fa-dumbbell"></i></span> Training
      </a>
      <a href="nutrition.html" onclick="closeMobileNav()">
        <span class="nav-icon"><i class="fas fa-apple-whole"></i></span> Nutrition
      </a>
      <a href="shop.html" onclick="closeMobileNav()">
        <span class="nav-icon"><i class="fas fa-bag-shopping"></i></span> Shop
      </a>
    </nav>
    <div class="mobile-nav-divider"></div>
    <div class="mobile-nav-actions">
      <a href="login.html" class="btn btn-outline" onclick="closeMobileNav()">Login</a>
      <a href="register.html" class="btn btn-primary" onclick="closeMobileNav()">Sign Up</a>
    </div>
  </div>

  </div>

  <div class="auth-container">
    <div class="auth-box">
      <h1>SIGN UP</h1>
      <p>Start your calisthenics journey today</p>
      
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label>Username</label>
          <div style="position:relative;">
            <span style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--primary);font-family:var(--font-heading);font-weight:700;">@</span>
            <input type="text" id="username" required placeholder="choose_a_username" pattern="[a-zA-Z0-9_]+" title="Letters, numbers and underscores only" style="padding-left:2rem;">
          </div>
          <small style="color:var(--text-muted);font-size:0.78rem;margin-top:0.3rem;display:block;">Letters, numbers and _ only. No spaces.</small>
        </div>
        
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Create a password">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1.2rem;">
          Create Account
        </button>
      </form>
      
      <p style="margin-top: 2rem; text-align: center;">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Login</a>
      </p>
      
      <p style="text-align: center; margin-top: 1rem;">
        <a href="index.html" style="color: var(--text-secondary);">← Back to Home</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // ربط Firebase Auth مع main.js
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name     = document.getElementById('name').value;
      const username = document.getElementById('username').value.trim().toLowerCase();
      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        alert('Username can only contain letters, numbers and underscores.');
        return;
      }
      
      if (typeof register === 'function') {
        register(name, email, password, username);
      } else {
        alert('❌ Authentication system not loaded. Please check main.js');
      }
    });
  </script>

  <script>    // Highlight active nav link
    (function(){
      const links = document.querySelectorAll('.mobile-nav-links a');
      const page  = window.location.pathname.split('/').pop() || 'index.html';
      links.forEach(a => { if (a.getAttribute('href') === page) a.classList.add('active'); });
    })();

    function toggleMobileNav() {
      const nav = document.getElementById('mobileNav');
      const btn = document.getElementById('hamburgerBtn');
      const isOpen = nav.classList.contains('open');
      if (isOpen) { closeMobileNav(); } else {
        nav.classList.add('open');
        btn.classList.add('open');
        document.body.style.overflow = 'hidden';
        // backdrop
        let bd = document.getElementById('mobileNavBackdrop');
        if (!bd) {
          bd = document.createElement('div');
          bd.id = 'mobileNavBackdrop';
          bd.className = 'mobile-nav-backdrop open';
          bd.onclick = closeMobileNav;
          document.body.appendChild(bd);
        } else { bd.classList.add('open'); }
      }
    }
    function closeMobileNav() {
      const nav = document.getElementById('mobileNav');
      const btn = document.getElementById('hamburgerBtn');
      nav.classList.remove('open');
      btn.classList.remove('open');
      document.body.style.overflow = '';
      const bd = document.getElementById('mobileNavBackdrop');
      if (bd) bd.classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMobileNav(); });
  </script>

</body>
</html>
